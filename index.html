<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arcade Fintech Festival</title>
    <!-- The seven display faces the show can pick from. Loaded once, up front,
         so switching a heading to one of them never flashes a fallback. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=Kumar+One+Outline&family=Monoton&family=Orbitron:wght@400..900&family=Audiowide&family=Electrolize&display=swap"
      rel="stylesheet"
    />
    <!-- Before anything paints: adopt the theme this screen wore last, so a
         light room does not flash a dark frame while the socket connects. The
         server corrects it a moment later if an operator switched meanwhile. -->
    <script>
      try {
        if (localStorage.getItem('arcade_ftw_theme') === 'light') {
          document.documentElement.dataset.theme = 'light'
        }
      } catch (error) {
        /* a blocked store is not worth a broken boot */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
